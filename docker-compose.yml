services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-multiagent}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-multiagent}
      REDIS_URL: redis://redis:6379
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL:-http://claude-sandbox-svc:8000}
      SANDBOX_ENABLED: ${SANDBOX_ENABLED:-true}
      SANDBOX_DEFAULT_TIMEOUT_SECONDS: ${SANDBOX_DEFAULT_TIMEOUT_SECONDS:-1800}
      SANDBOX_POLL_INTERVAL_SECONDS: ${SANDBOX_POLL_INTERVAL_SECONDS:-3}
      SANDBOX_MAX_ITERATIONS: ${SANDBOX_MAX_ITERATIONS:-50}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      claude-sandbox-svc:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./apps/api/src
          target: /app/src
        - action: rebuild
          path: ./apps/api/pyproject.toml

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /app/src
        - action: rebuild
          path: ./apps/web/package.json

  claude-sandbox-svc:
    build:
      context: ./apps/claude-sandbox-svc
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TOKEN_SECRET: ${TOKEN_SECRET:-dev-secret-change-me}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-qa-sandbox:local}
      SANDBOX_MEM_LIMIT: ${SANDBOX_MEM_LIMIT:-2g}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1.0}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-2}
      DEFAULT_TIMEOUT_SECONDS: ${DEFAULT_TIMEOUT_SECONDS:-1800}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      DATA_DIR: /data
      PUBLIC_BASE_URL: ${SANDBOX_PUBLIC_BASE_URL:-http://localhost:8100}
      VNC_PROXY_MODE: ${VNC_PROXY_MODE:-proxy}
      VNC_BIND_HOST: ${VNC_BIND_HOST:-127.0.0.1}
      DEFAULT_MODEL: ${SANDBOX_DEFAULT_MODEL:-claude-sonnet-4-5-20250929}
    ports:
      - "${SANDBOX_PORT:-8100}:8000"
    volumes:
      # The service spawns sandbox containers via the host Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Per-task artifacts live on the host so they survive restarts and so
      # the spawned sandbox containers can bind-mount them by absolute host path.
      - sandbox_data:/data
    develop:
      watch:
        - action: sync
          path: ./apps/claude-sandbox-svc/app
          target: /app/app
        - action: rebuild
          path: ./apps/claude-sandbox-svc/pyproject.toml

volumes:
  postgres_data:
  redis_data:
  sandbox_data:
